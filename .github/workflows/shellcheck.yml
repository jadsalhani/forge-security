name: ShellCheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          severity: warning

      - name: Verify script syntax
        run: bash -n harden.sh

      - name: Test --help flag
        run: ./harden.sh --help

      - name: Test --version flag
        run: ./harden.sh --version
